# StrataDrive Reference Baseline v0.1: design data only, no runtime loader.
# Engineering starting points, not production requirements or measured results.
# null = TBD, never zero/default/disabled. Decision owners are in docs/roadmap.md.
# RG-01 (2026-10-13) extends the current design; M0 v0.1 review remains historical.
# EV-01 adds BMS/power; ZON-01 accepts two logical Zones as planned design data.
profile_id: reference
status: defined
baseline_name: StrataDrive Reference Baseline v0.1
requirement_baseline: v0.1
design_extensions:
  - id: RG-01
    scope_status: accepted
    requirement_revision: v0.2
    requirements: [SYS-CTRL-008, SYS-CTRL-009, SYS-SAFE-004, SYS-SAFE-005]
  - id: EV-01
    scope_status: accepted
    requirement_revision: v0.3
    requirements: [SYS-EV-001, SYS-EV-002, SYS-EV-003, SYS-EV-004, SYS-EV-005, SYS-COM-003, SYS-COM-004, SYS-PERF-002]
  - id: ZON-01
    scope_status: accepted
    requirement_revision: v0.4
    requirements: [SYS-ARCH-003]
implementation_status: planned
verification_status: not_run
purpose: identical_workload_on_each_independent_target
eligible_targets:
  - jetson_agx_thor
  - jetson_orin_nx
deployment: one_independent_target_per_vehicle_run
architecture:
  reference_zone_count: 2 # ZON-01; runtime planned, not a deployment switch
  single_zone_bringup: component_validation_before_m4_split
  reference_packaging: rear_drive_single_motor
  planned_leaf_functions: [steering, brake, drive, bms]
  front_leaf_functions: [steering, brake] # Brake remains vehicle-wide aggregate
  rear_leaf_functions: [drive, bms]
  vehicle_management_owner: front_zone
  allocation_owner: front_zone
  upper_feedback_owner: front_zone
  upper_feedback_path: leaf_responsible_zone_front_aggregate_central_or_host
  cross_zone_contract: null # TBD-15; schema/QoS/queue/clock/rejoin before M4/M5 tests
odd:
  weather: clear_daylight
  road: paved_straight_and_gentle_curves
  ego_vehicle_count: 1
  traffic_lights: false
  complex_intersections: false
  complex_traffic_interaction: false
  normal_scenario_other_traffic: false
  speed_range_kmh: [0, 40]
scenarios:
  normal: [S01, S02, S03]
  fault: [F01, F02, F03, F04]
  s01_target_speed_kmh: 30
  s02_target_speed_kmh: 30
  s03_speed_requests_kmh: [30, 20]
  route_map_seed: null # TBD-07 / M7
  speed_transition_profile: null # TBD-11 / M8; fixed before test
acceptance:
  steady_state_speed_max_abs_error_kmh: 1
  lateral_cross_track_abs_p95_m: 0.3
  heading_abs_p95_deg: 3
  overspeed_fraction_of_positive_validated_target: 0.10
  critical_stream_loss_detection_max_ms: 100
  loss_detection_origin: last_valid_rx
  invalid_command_refreshes_valid_age: false
  raw_command_fallback_on_actual_loss: false
  carla_ego_actuation_writer: plant_adapter_only
  percentile_method: nearest_rank
  speed_plateau_settling_sim_seconds: 5
  speed_plateau_min_evaluation_sim_seconds: 10
logical_timing:
  simulation_sensor: {rate_hz: 20, period_ms: 50}
  planner: {rate_hz: 20, period_ms: 50}
  vehicle_controller: {rate_hz: 50, period_ms: 20}
  zone_controller: {rate_hz: 100, period_ms: 10}
  steering_vecu: {rate_hz: 100, period_ms: 10}
  brake_vecu: {rate_hz: 100, period_ms: 10}
  drive_vecu: {rate_hz: 100, period_ms: 10}
  # ADR-0016 / EV wire draft: planned rates, no runtime loader or measured timing.
  bms_vecu: {rate_hz: 50, period_ms: 20} # local battery/model sampling and limit calculation
  bms_battery_state: {rate_hz: 10, period_ms: 100} # observational CAN publication
  bms_power_limits: {rate_hz: 50, period_ms: 20}
  bms_power_status: {rate_hz: 100, period_ms: 10}
  bms_power_request: {rate_hz: 50, period_ms: 20}
  drive_battery_limits: {rate_hz: 50, period_ms: 20}
  drive_permission: {rate_hz: 100, period_ms: 10}
  power_lifecycle_task: {rate_hz: 100, period_ms: 10} # modeled power response/status
  zone_status_feedback_bridge: {rate_hz: 100, period_ms: 10}
  functional_scheduling_quantum_ms: 10
  task_deadlines_ms: null # TBD-04 / M3
  e2e_deadline_ms: null # TBD-04 / M5/M7
  timeout_thresholds_ms: null # TBD-01/04 / M1; allow monitor + jitter margin
clock_policy:
  local_timeout_clock: receiver_monotonic_wall_time
  functional_replay_timeout_clock: simulation_time_separate_results
  pause_resets_valid_age: false
  run_reset: new_epoch_and_init_gate
  cross_node_sync: null # TBD-04/05 / M3/M5
m1_local_can_fixture:
  technical_status: host_unit_vcan_checked
  wire_acceptance: learner_review_pending
  epoch_issuer: durable_linux_local_store
  issuer_owner: front_session_coordinator # M1 harness calls issuer; actual peer/vehicle INIT in M4/M5
  deployment_store_directory: null # configured persistent path; no profile loader, TBD-05/15
  application_queue_capacity: 32
  ingress_budget_per_cycle: 8
  dispatch_budget_per_cycle: 8
  polling_sleep_ms: 1 # fixture only, not a Target scheduling guarantee
  continuity_loss_policy: discard_backlog_latch_unavailable
  recovery: newer_trusted_epoch_and_clean_ingress
plant_policy:
  simulator_mode: synchronous_fixed_step
  tick_owner: host_orchestrator
  actuation_source: vecu_actual_feedback_only
  missing_invalid_stale_actual: gate_next_apply_and_tick
  coordinate_frame: x_forward_y_left_z_up_yaw_left_positive
  ego_reference_point: rear_axle_center
  carla_mapping_calibration: null # TBD-02/07 / M6/M7
state_policy:
  states: [INIT, NORMAL, DEGRADED, FAIL_SAFE]
  critical_stream_loss: FAIL_SAFE
  recovery: explicit_reinitialize_then_init_checks
  drive_command_timeout_target: zero_motor_torque # RG-01: cancel positive and negative demands
  actuator_physical_reaction_parameters: null # TBD-03 / M2
control:
  lateral_algorithm: null # TBD-11 / M8; Pure Pursuit or Stanley
  longitudinal_algorithm: longitudinal_pid_planned
  allocation_parameters: null # TBD-02/06 / M2/M4
regenerative_braking:
  scope: included_in_design # no runtime feature loader exists
  drive_torque_sign: positive_propulsion_negative_forward_regeneration
  brake_pressure_meaning: friction_brake_only
  torque_reference: aggregate_driven_wheel_equivalent
  allocation_owner: front_zone
  energy_source: valid_actual_torque_and_wheel_speed
  energy_unit: J
  capability_invalid_new_regen_target_nm: 0
  common_wheel_geometry: null # TBD-02 / M2/M6
  friction_pressure_to_torque_calibration: null # TBD-02 / M2/M6
  regen_torque_envelope: null # TBD-03 / M2; speed and motor limits
  charge_acceptance_model: null # TBD-03 / M2; include zero/limited/stale fixtures
  recovery_efficiency: null # TBD-02/03 / M2/M6
  low_speed_transition_and_hold: null # TBD-03/06 / M2/M4
  capability_freshness_policy: null # TBD-01/02/04 / M1/M3/M4
  blending_response_and_deficit_budget: null # TBD-03/06 / M2/M4
  energy_integration_tolerance: null # TBD-02/03 / M2/M6
ev_power_bms:
  scope: included_in_design # communication libraries tested; model/runtime loader not implemented
  upper_status_owner: bms_vecu_via_rear_then_front_zone
  battery_model_and_bms_controller_separate: true
  power_lifecycle_states: [OFF, CHECKS, PRECHARGE, HV_READY, SHUTDOWN]
  power_readiness_is_system_normal: false
  valid_zero_limit_means: no_allowed_power
  current_sign: positive_discharge_negative_charge
  limit_unit: W
  soc_unit: fraction_0_to_1
  power_sequence_and_fault_reactions: null # TBD-12 / M1/M2/M4
  drive_permission_and_recovery_gates: null # TBD-12/14
  usable_capacity_and_initial_soc: null # TBD-13 / M2
  voltage_current_temperature_model: null # TBD-13 / M2
  local_cell_extrema_inputs: [min_cell_voltage_v, max_cell_voltage_v, min_cell_temperature_c, max_cell_temperature_c]
  local_cell_extrema_policy: independent_voltage_temperature_pair_validity_source_time_and_model_batch
  cell_extrema_thresholds_and_dwell: null # TBD-13 / M2; no per-cell chemistry/balancing model
  charge_discharge_limit_calibration: null # TBD-13 / M2
  losses_auxiliary_load_and_energy_tolerance: null # TBD-13 / M2/M6
  wire_draft:
    status: proposed_host_codec_receiver_vcan_tested # ADR-0016/17; actual model/Zone runtime still planned
    schema_version: 1 # EV family only; actuator schema remains 2
    dbc: interfaces/dbc/bms_m1_draft.dbc
    critical_frames: [BmsPowerRequest, BmsPowerStatus, BmsPowerLimits, DriveBatteryLimits, DrivePermission]
    observational_frames: [BmsBatteryState]
    critical_source_age_max_ms: 50
    critical_dependency_age_max_ms: 70
    critical_rx_timeout_ms: 80
    monitor_period_ms: 10
    dispatch_jitter_margin_ms: 10
    request_permission_max_lifetime_ms: 80
    deadline_policy: preserve_original_parent_expiry
    observation_source_group_age_max_ms: 150
    observation_rx_unavailable_ms: 300
    source_clock: shared_target_monotonic_in_trusted_epoch
    startup_parent_model_identity_contract: null # TBD-12/14; trusted coordinator protocol pending, typed receiver checks tested
    drive_auxiliary_dependency_policy: explicit_opt_in_70ms_input_default_30ms # source/torque remain 30 ms; no runtime loader
    cross_node_budget_and_clock: null # TBD-04/05/14/15; before M3/M5/M6 acceptance
  model_placement_clock_and_single_energy_owner: null # TBD-07/04 / M6/M7
# Future AI comparison workload; classical M8 scenarios do not require an AI model.
workload:
  perception_model: null # TBD-09 / M10
  model_checksum: null # TBD-09 / M10
  precision: null # TBD-09 / M10
  camera_resolution: null # TBD-09 / M10
  camera_fps: 20 # Reference sensor starting point, not measured throughput
  segmentation_enabled: null # TBD-09 / M10
  tracking_enabled: null # TBD-09 / M10
  temporal_model: null # TBD-10 / M11
  temporal_history_seconds: null # TBD-10 / M11
  temporal_hidden_size: null # TBD-10 / M11
software_revision: null # resolved at each future run, not an unresolved design choice
measurement:
  timing_warmup_seconds: null # TBD-04 / M3
  timing_duration_seconds: null # TBD-04 / M3
  repetitions: null # TBD-04/11 / M3/M8, TBD-09 / M12
  power_mode: null # TBD-09 / M12
  cooling_condition: null # TBD-09 / M12
  metrics:
    - speed_tracking_error
    - lateral_cross_track_error
    - heading_error
    - overspeed
    - critical_stream_loss_detection
    - end_to_end_control_latency
    - control_jitter
    - deadline_miss
    - ai_latency
    - camera_to_trajectory_latency
    - fps
    - cpu_utilization
    - gpu_utilization
    - ram
    - power
    - temperature
