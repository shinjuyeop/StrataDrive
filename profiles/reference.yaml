# StrataDrive Reference Baseline v0.1: design data only, no runtime loader.
# M3 local Host timing fixture is a separate experiment, not a vehicle deadline.
# Engineering starting points, not production requirements or measured results.
# null = TBD, never zero/default/disabled. Decision owners are in docs/roadmap.md.
# RG-01 (2026-10-13) extends the current design; M0 v0.1 review remains historical.
# EV-01 adds BMS/power; ZON-01 accepts two logical Zones as planned design data.
profile_id: reference
status: defined
baseline_name: StrataDrive Reference Baseline v0.1
requirement_baseline: v0.1
design_extensions:
  - id: RG-01
    scope_status: accepted
    requirement_revision: v0.2
    requirements: [SYS-CTRL-008, SYS-CTRL-009, SYS-SAFE-004, SYS-SAFE-005]
  - id: EV-01
    scope_status: accepted
    requirement_revision: v0.3
    requirements: [SYS-EV-001, SYS-EV-002, SYS-EV-003, SYS-EV-004, SYS-EV-005, SYS-COM-003, SYS-COM-004, SYS-PERF-002]
  - id: ZON-01
    scope_status: accepted
    requirement_revision: v0.5
    requirements: [SYS-ARCH-003, SYS-CTRL-008, SYS-SAFE-005, SYS-EV-003]
implementation_status: planned
verification_status: not_run
purpose: identical_workload_on_each_independent_target
eligible_targets:
  - jetson_agx_thor
  - jetson_orin_nx
deployment: one_independent_target_per_vehicle_run
architecture:
  reference_zone_count: 2 # ZON-01 v0.5; runtime planned, not a deployment switch
  single_zone_bringup: component_validation_before_m4_split
  reference_packaging: rear_drive_single_motor
  planned_leaf_functions: [steering, brake, drive, bms]
  front_leaf_functions: [steering, brake] # Brake remains vehicle-wide aggregate
  rear_leaf_functions: [drive, bms]
  vehicle_management_owner: central_vehicle_management
  allocation_owner: central_control_allocation
  upper_feedback_owner: central_feedback_bridge
  upper_feedback_path: leaf_responsible_zone_central_bridge_host
  application_topology: central_to_each_zone
  front_command_path: central_front_leaf
  rear_command_path: central_rear_leaf
  central_zone_contract: null # TBD-15; schema/QoS/queue/clock/rejoin before M4/M5 tests
odd:
  weather: clear_daylight
  road: paved_straight_and_gentle_curves
  ego_vehicle_count: 1
  traffic_lights: false
  complex_intersections: false
  complex_traffic_interaction: false
  normal_scenario_other_traffic: false
  speed_range_kmh: [0, 40]
scenarios:
  normal: [S01, S02, S03]
  fault: [F01, F02, F03, F04]
  s01_target_speed_kmh: 30
  s02_target_speed_kmh: 30
  s03_speed_requests_kmh: [30, 20]
  route_map_seed: null # TBD-07 / M7
  speed_transition_profile: null # TBD-11 / M8; fixed before test
acceptance:
  steady_state_speed_max_abs_error_kmh: 1
  lateral_cross_track_abs_p95_m: 0.3
  heading_abs_p95_deg: 3
  overspeed_fraction_of_positive_validated_target: 0.10
  critical_stream_loss_detection_max_ms: 100
  loss_detection_origin: last_valid_rx
  invalid_command_refreshes_valid_age: false
  raw_command_fallback_on_actual_loss: false
  carla_ego_actuation_writer: plant_adapter_only
  percentile_method: nearest_rank
  speed_plateau_settling_sim_seconds: 5
  speed_plateau_min_evaluation_sim_seconds: 10
logical_timing:
  simulation_sensor: {rate_hz: 20, period_ms: 50}
  planner: {rate_hz: 20, period_ms: 50}
  vehicle_controller: {rate_hz: 50, period_ms: 20}
  zone_controller: {rate_hz: 100, period_ms: 10}
  steering_vecu: {rate_hz: 100, period_ms: 10}
  brake_vecu: {rate_hz: 100, period_ms: 10}
  drive_vecu: {rate_hz: 100, period_ms: 10}
  # ADR-0016 / EV wire draft: planned rates, no runtime loader or measured timing.
  bms_vecu: {rate_hz: 50, period_ms: 20} # local battery/model sampling and limit calculation
  bms_battery_state: {rate_hz: 10, period_ms: 100} # observational CAN publication
  bms_power_limits: {rate_hz: 50, period_ms: 20}
  bms_power_status: {rate_hz: 100, period_ms: 10}
  bms_power_request: {rate_hz: 50, period_ms: 20}
  drive_battery_limits: {rate_hz: 50, period_ms: 20}
  drive_permission: {rate_hz: 100, period_ms: 10}
  power_lifecycle_task: {rate_hz: 100, period_ms: 10} # modeled power response/status
  zone_status_feedback_bridge: {rate_hz: 100, period_ms: 10}
  functional_scheduling_quantum_ms: 10
  task_deadlines_ms: null # TBD-04 / M3
  e2e_deadline_ms: null # TBD-04 / M5/M7
  timeout_thresholds_ms: null # TBD-01/04 / M1; allow monitor + jitter margin
clock_policy:
  local_timeout_clock: receiver_monotonic_wall_time
  functional_replay_timeout_clock: simulation_time_separate_results
  pause_resets_valid_age: false
  run_reset: new_epoch_and_init_gate
  cross_node_sync: null # TBD-04/05 / M3/M5
m1_local_can_fixture:
  technical_status: host_unit_vcan_checked
  wire_acceptance: learner_review_pending
  epoch_issuer: durable_linux_local_store
  issuer_owner: central_session_coordinator # M1 harness calls issuer; actual Central-Zone INIT in M4/M5
  deployment_store_directory: null # configured persistent path; no profile loader, TBD-05/15
  application_queue_capacity: 32
  ingress_budget_per_cycle: 8
  dispatch_budget_per_cycle: 8
  polling_sleep_ms: 1 # fixture only, not a Target scheduling guarantee
  continuity_loss_policy: discard_backlog_latch_unavailable
  recovery: newer_trusted_epoch_and_clean_ingress
